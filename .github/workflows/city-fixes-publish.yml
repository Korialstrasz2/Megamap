name: Publish painted terrain and perspective fixes
on:
  push:
    branches: [fix/painted-terrain-and-perspective]
    paths: [.github/workflows/city-fixes-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed fixes
        run: |
          python .fix-transfer/edit_generation.py
          python .fix-transfer/edit_infill_boats.py
          python .fix-transfer/edit_smart.py
          python .fix-transfer/edit_projection.py
          python .fix-transfer/edit_complex_labels.py
          for file in src/*.js; do node --check "$file"; done
      - name: Verify exact source hashes
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected={
            'src/city-complexes.js':'12fc52bb2f550d8e67689a66845401207cd77d223fc8089d2ce0e7241a83eac6',
            'src/city-perspective.js':'4bf3d4ee3fd563dc3967a44917268c33c56cbeda0ebd1eeaafc2bc169c7dc2b8',
            'src/city-plan.js':'0171ed42294473fc5df2ea342c0db44b4ea38c1a21c67a980e1fc904e7001727',
            'src/city-smart.js':'2e1deab6f55e8ee1bf4f1b7d238254cf13e84d123bcbdef3316aa39cf34a342d',
            'src/city-studio.js':'e0d0285586b47ea64a6fac804f18c2ae84e13b30f3504227a32b8535320e6580',
            'src/map-labels.js':'a0efbcb31a242f963c6e7437c05833f442c1a25360684a4a39ec56db00918e2b'
          }
          for name,want in expected.items():
              got=hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert got==want,(name,got,want)
              print(name,got)
          PY
      - name: Targeted painted city regressions
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const E=require('./src/engine'), C=E.CITY_STUDIO, Perspective=require('./src/city-perspective');
          const plan={version:1,strokes:[
            {role:'river',width:34,points:[[250,0],[260,300],[340,520],[420,1000]]},
            {role:'smart',width:270,points:[[220,80],[500,120],[470,330],[300,360]]},
            {role:'smart',width:130,points:[[760,170],[900,180]]},
            {role:'smart',width:100,points:[[530,650],[620,680]]},
            {role:'road',width:11,points:[[170,250],[590,270],[760,190],[900,180]]},
            {role:'road',width:10,points:[[590,270],[760,500],[560,650],[420,900]]},
            {role:'wall',width:6,points:[[180,100],[210,330],[340,430],[620,360],[900,110]]}
          ]};
          const s=E.generate('fantasy','terrain-fix',{preset:'council',structureCount:1200,boatCount:9,cityPlan:plan,hq:true});
          assert(s.cityStudio.statistics.buildings>120);
          assert(s.features.filter(f=>f.cityRole==='vessel').length>0);
          const complexes=new Set(s.features.map(f=>f.cityComplex).filter(Boolean));
          for(const k of ['fortress','temple','warehouse']) assert(complexes.has(k),k+' complex missing');
          for(const bearing of [0,90,180,270]){
            const svg=Perspective.render(s,{},bearing);
            assert(svg.includes('data-terrain-mesh="64"'));
            assert(!/NaN|undefined/.test(svg));
          }
          const wall=s.features.find(f=>f.type==='wall');
          assert(Perspective.wallPanels(s,wall,6/s.scale).length>2);
          console.log('buildings',s.cityStudio.statistics.buildings,'boats',s.features.filter(f=>f.cityRole==='vessel').length);
          NODE
      - name: Complete source regression suite
        run: node --test tests/*.test.cjs
      - name: Commit reviewed fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .fix-transfer .github/workflows/city-fixes-publish.yml
          git add src/city-complexes.js src/city-perspective.js src/city-plan.js src/city-smart.js src/city-studio.js src/map-labels.js
          git diff --cached --check
          git commit -m "Fix painted city capacity, boats, complexes and 2.5D terrain"
          git push origin HEAD:fix/painted-terrain-and-perspective
