name: Assemble recovered encounters
on:
  push:
    branches: [feature/six-battle-encounters]
    paths: [.github/workflows/assemble-encounters.yml]
permissions:
  contents: write
jobs:
  assemble:
    if: github.ref == 'refs/heads/feature/six-battle-encounters' && !contains(github.event.head_commit.message, '[assembled]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and assemble the recovered source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma, subprocess
          chunks = ''.join(Path(f'.github/encounter-patch-{i}.b64').read_text().strip() for i in [1,2,3])
          decoder = lzma.LZMADecompressor()
          partial = decoder.decompress(base64.b64decode(chunks, validate=True))
          marker = b'diff --git a/src/engine.js'
          assert marker in partial
          prefix = partial[:partial.index(marker)]
          assert hashlib.sha256(prefix).hexdigest() == '92897e0847588d7c72c4038909b0030ae9bbbb84c8d2656ed68d107b7464a2e6'
          recovery = lzma.decompress(base64.b64decode(Path('.github/encounter-recovery.b64').read_text().strip(), validate=True))
          assert hashlib.sha256(recovery).hexdigest() == '1a1c6fc0fc3d43d5916438323b3177f475307869942fedda6fb767e03d2ae08f'
          for name, data, flags in [('encounter-prefix', prefix, ['--unidiff-zero']), ('encounter-recovery', recovery, [])]:
              target = Path('/tmp') / (name + '.patch')
              target.write_bytes(data)
              subprocess.run(['git','apply','--check',*flags,str(target)],check=True)
              subprocess.run(['git','apply',*flags,str(target)],check=True)
          p=Path('.github/workflows/encounter-expansion.yml')
          p.write_text(p.read_text().replace("data['pageErrors']", "data['errors']"))
          PY
          node scripts/build-assets.cjs
          node scripts/build-encounter-examples.cjs
          node --test tests/*.test.cjs
      - name: Remove temporary transport and publish only completed implementation
        shell: bash
        run: |
          git rm .github/encounter-patch-1.b64 .github/encounter-patch-2.b64 .github/encounter-patch-3.b64 .github/encounter-recovery.b64 .github/workflows/assemble-encounters.yml
          git add src/ tests/ assets/ docs/ scripts/ examples/ index.html package.json README.md README.html README.txt CHANGELOG.md .github/workflows/encounter-expansion.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add six battle encounters, 32 vector props, Italian UI and regression coverage [assembled]'
          git push origin HEAD:feature/six-battle-encounters
