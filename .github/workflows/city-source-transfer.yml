name: City source transfer
on:
  push:
    branches: [feature/fantasy-city-studio]
    paths: [.github/workflows/city-source-transfer.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: git archive HEAD -o /tmp/megamap-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: city-source-snapshot
          path: /tmp/megamap-source.zip
          retention-days: 1
