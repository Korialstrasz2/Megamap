name: Finalize City Studio verification fixes
on:
  push:
    branches: [feature/fantasy-city-studio]
    paths: [.github/workflows/city-studio-finalize.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply readable repairs and verify against locally tested files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          def replace(text, old, new):
              assert text.count(old) == 1, ('Unexpected replacement count', old)
              return text.replace(old, new)
          def write(path, text, expected):
              raw = text.encode()
              assert hashlib.sha256(raw).hexdigest() == expected, path
              Path(path).write_bytes(raw)
          path = 'src/city-studio.js'
          source = Path(path).read_text()
          start = source.index('function tinySettlement(s)')
          end = source.index('/** Civic compounds', start)
          fixed = '''function tinySettlement(s){const st=s.cityStudio,v=st.resolved,g=st.ground,r=rng(s.seed+'-huts'),ward=st.neighborhoods[0];let route=s.features.find(f=>f.type==='road'&&f.cityRole==='lane'),n=0,ix=networkIndex(s),occupied=builtIndex(s);
           // Deliberately finite four-hut plan at physical scale, with verified access.
           for(const [x,y]of [[355,420],[405,625],[535,390],[555,555],[290,545],[365,710]]){if(n>=v.count)break;const near=nearestRoad(s,[x,y]),angle=near?Math.atan2(near.point[1]-y,near.point[0]-x)+Math.PI/2:0,poly=rect([x,y],(6+r()*1.5)/v.metersPerUnit,(8+r()*2)/v.metersPerUnit,angle);if(!footprintGood(s,poly,ix,occupied)||!near)continue;
           // The near face is edge zero: the local negative-y normal points toward the road.
           const end=point(poly[0],poly[1],.5),access=[near.point,end],accessPoly=corridor(...access,7);if(occupied.hits(accessPoly,.1)||!dryLine(g,access,1)||!currentWaterClear(s,accessPoly,0))continue;
           const f=emit(s,'building',{polygon:poly,x,y,ward:ward.feature,quarter:'commons',buildingKind:'shack',cityRole:'building',cityCulture:v.culture,cityRoof:'gable',cityFloors:1,cityFront:0,roof:n%3,elevationM:heightAt(g,[x,y]),label:'',notes:''});occupied.add(poly,{feature:f});
           street(s,access,'access',7,{cityBuilding:f.id,cityStreet:near.road.id,ward:ward.feature});occupied.add(accessPoly,{access:f.id});n++;
           }
           if(n<v.count)buildFrontages(s,null,v.count-n);
          }
          '''
          write(path, source[:start]+fixed+source[end:], 'eb1b8e868826b01b14be11aa205592c44c5c13a926f26f20ceea19d998881648')
          path = 'src/editor-core.js'
          source = replace(Path(path).read_text(), " cityLevel:s.cityStudio&&(a.cityLevel==='rooftops'&&s.options.rooftops||a.cityLevel==='underground'&&s.options.underground)?a.cityLevel:'surface',", " ...(s.cityStudio?{cityLevel:(a.cityLevel==='rooftops'&&s.options.rooftops||a.cityLevel==='underground'&&s.options.underground)?a.cityLevel:'surface'}:{}),")
          write(path, source, '31aafdabe5c114a077c6dc667f43049b6f61511097cb1f7bf695f94cfbbd8007')
          path = 'tests/city-studio.test.cjs'
          source = Path(path).read_text()
          marker = '   const poly=C.corridor(a.points[i-1],a.points[i],a.width*.8);'
          source = replace(source, marker, marker+'''\n   for(const t of [.05,.15,.25,.4,.5,.6,.75,.85,.95,.99]){const p=[a.points[i-1][0]+(a.points[i][0]-a.points[i-1][0])*t,a.points[i-1][1]+(a.points[i][1]-a.points[i-1][1])*t];assert(!E.inside(p,b.polygon)||E.nearPolyline(p,[...b.polygon,b.polygon[0]])<.001,'Access crosses its own building before reaching the door: '+b.id);}''')
          marker = "for(const p of C.PRESETS)test(p.id+': repeated-seed geometry, road access, placement and ships',()=>{"
          source = replace(source, marker, '''test('Legacy appearance and shipped battle atlases do not acquire City Studio metadata',()=>{
           for(const mode of ['region','city','battle']){const s=E.generate(mode,'appearance-legacy',{districts:12});assert(!('cityLevel' in Core.appearance(s)));}
           const {execFileSync}=require('node:child_process'),path=require('node:path');
           for(const script of ['build-arena-example.cjs','build-encounter-examples.cjs'])execFileSync(process.execPath,[path.resolve(__dirname,'../scripts',script),'--check'],{stdio:'pipe'});
           const s=make('fishing');assert.equal(Core.appearance(s).cityLevel,'surface');
          });
          '''+marker)
          source = replace(source, 'assert(!s.cityStudio.warnings.length);}', 'assert(!s.cityStudio.warnings.length);geometryCheck(s);}')
          write(path, source, 'ea7b67b9fbfc781c0cd477fce9105b3e6196a535c4f242d44cfbbb47a55d9c75')
          PY
          git diff --check
      - name: Verify legacy examples without modifying their geometry
        run: |
          node scripts/build-arena-example.cjs --check
          node scripts/build-encounter-examples.cjs --check
      - name: Update deterministic City Studio examples and run regressions
        run: |
          node scripts/build-city-studio-examples.cjs
          node scripts/build-city-studio-examples.cjs --check
          node --test tests/*.test.cjs
      - name: Commit verified fixes on the isolated feature branch
        run: |
          git add src/city-studio.js src/editor-core.js tests/city-studio.test.cjs examples/City-Studio.megamap.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Fix near-side hut access and preserve legacy atlas serialization; add regressions"
          git push origin HEAD:feature/fantasy-city-studio
