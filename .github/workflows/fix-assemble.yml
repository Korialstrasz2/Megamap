name: Assemble city terrain fixes
on:
  push:
    branches: [fix/painted-terrain-and-perspective]
    paths: [.github/workflows/fix-assemble.yml]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply hash-guarded fix bundle
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          digest=lambda b: hashlib.sha256(b).hexdigest()
          encoded=b''.join(Path(f'.fix-transfer/part-{i:02}.b64').read_bytes().strip() for i in range(8))
          raw=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert digest(raw)=='61c21da47a70a8136b3f7377fd9683a0a3dd4e31530c80819bd1d3bb8cc07e9e'
          ops=json.loads(raw)
          assert len(ops)==9
          for op in ops:
              path=Path(op['path'])
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              if op['before'] is None:
                  assert not path.exists(), str(path)
                  text=''
              else:
                  original=path.read_bytes()
                  assert digest(original)==op['before'], 'Base mismatch: '+str(path)
                  text=original.decode('utf-8')
              for start,stop,replacement in reversed(op['edits']):
                  text=text[:start]+replacement+text[stop:]
              data=text.encode('utf-8')
              assert digest(data)==op['after'], 'Result mismatch: '+str(path)
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(data)
              print('Verified',path)
          PY
          for file in src/*.js; do node --check "$file"; done
      - name: Run complete source tests
        run: node --test tests/*.test.cjs
      - name: Rebuild deterministic outputs
        run: |
          node scripts/build-assets.cjs
          node scripts/build-city-studio-examples.cjs
          node scripts/build-city-studio-examples.cjs --check
          node scripts/build-painted-city-examples.cjs
          node scripts/build-painted-city-examples.cjs --check
          node scripts/build-smart-city-examples.cjs
          node scripts/build-smart-city-examples.cjs --check
          node scripts/build-encounter-examples.cjs --check
          node scripts/build-arena-example.cjs --check
      - name: Remove transfer and refresh package manifest
        run: |
          git rm -r .fix-transfer
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          manifest='docs/SHA256_MANIFEST.json'
          omit={manifest,'.github/workflows/fix-assemble.yml'}
          names=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          files={n:hashlib.sha256(Path(n).read_bytes()).hexdigest() for n in sorted(names) if n and n not in omit}
          Path(manifest).write_text(json.dumps({'version':'1.2.0','build':'Painted terrain, placement and 2.5D fixes','algorithm':'SHA-256','excluded':[manifest],'files':files},indent=2)+'\n',encoding='utf-8')
          PY
          node scripts/verify-package.cjs
          git add -A
          git diff --cached --check
      - name: Commit fixes to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Korialstrasz2@users.noreply.github.com'
          git commit -m "Fix painted-city capacity, complexes, boats and 2.5D projection"
          git push origin HEAD:fix/painted-terrain-and-perspective
