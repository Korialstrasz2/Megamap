name: Assemble verified Arena HQ source
on:
  push:
    branches: [feature/arena-hq-battles]
    paths: [.github/workflows/assemble-arena-hq.yml]
permissions:
  contents: write
jobs:
  assemble:
    if: github.ref == 'refs/heads/feature/arena-hq-battles' && !contains(github.event.head_commit.message, '[assembled]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and assemble tested source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma, subprocess
          chunks = ''.join(Path(f'.github/hq-part-{i}.b64').read_text().strip() for i in [1, 2, 3])
          data = lzma.decompress(base64.b64decode(chunks, validate=True))
          assert hashlib.sha256(data).hexdigest() == '36975917ec7613c68e39bcbd1410b31ceaaf59bb489be1d51d612bfb644817c4'
          assert b'diff --git a/.github/' not in data
          path = Path('/tmp/arena-hq.patch')
          path.write_bytes(data)
          subprocess.run(['git', 'apply', '--check', '--unidiff-zero', str(path)], check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', str(path)], check=True)
          PY
          node scripts/build-encounter-examples.cjs
          node scripts/build-arena-example.cjs
          node --test tests/*.test.cjs
      - name: Publish verified implementation without changing workflows
        shell: bash
        run: |
          git rm .github/hq-part-1.b64 .github/hq-part-2.b64 .github/hq-part-3.b64
          git add src/ tests/ scripts/ docs/ examples/ index.html README.md README.html README.txt CHANGELOG.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement Arena and default-on HQ battle rendering [assembled]'
          git push origin HEAD:feature/arena-hq-battles
