name: Encounter expansion checks
on:
  push:
    branches: [main, feature/six-battle-encounters]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  encounters:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Engine and editor regressions
        run: node --test tests/*.test.cjs
      - name: Package matching source for reproducibility
        if: always()
        run: git archive --format=tar.gz -o "$RUNNER_TEMP/encounter-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encounter-source-${{ github.run_id }}
          path: ${{ runner.temp }}/encounter-source.tar.gz
          retention-days: 7
