name: Assemble City Part 2 source
on:
  push:
    branches: [feature/city-part2-smart-complexes]
    paths: [.github/workflows/part2-publish.yml]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed source operations with before and after hashes
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          digest = lambda data: hashlib.sha256(data).hexdigest()
          encoded = b''.join(Path(f'.part2-transfer/part-{i}.b64').read_bytes().strip() for i in range(3))
          raw = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert digest(raw) == '224d118160ad547aea93a9e2d64cefe26940357b872217e60839378e899c0b8b', 'Source bundle mismatch'
          operations = json.loads(raw)
          assert len(operations) == 30
          for op in operations:
              path = Path(op['path'])
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              assert path.parts[0] != '.github' and not path.is_symlink()
              assert all(not parent.is_symlink() for parent in path.parents)
              if op['before'] is None:
                  assert not path.exists(), str(path)
                  text = ''
              else:
                  original = path.read_bytes()
                  assert digest(original) == op['before'], 'Base mismatch: ' + str(path)
                  text = original.decode('utf-8')
              end = 0
              for start, stop, replacement in op['edits']:
                  assert end <= start <= stop <= len(text)
                  end = stop
              for start, stop, replacement in reversed(op['edits']):
                  text = text[:start] + replacement + text[stop:]
              result = text.encode('utf-8')
              assert digest(result) == op['after'], 'Result mismatch: ' + str(path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(result)
              print('Verified', path)
          PY
          for file in src/*.js; do node --check "$file"; done
      - name: Rebuild bundled assets and deterministic city examples
        run: |
          node scripts/build-assets.cjs
          node scripts/build-city-studio-examples.cjs
          node scripts/build-city-studio-examples.cjs --check
          node scripts/build-painted-city-examples.cjs
          node scripts/build-painted-city-examples.cjs --check
          node scripts/build-smart-city-examples.cjs
          node scripts/build-smart-city-examples.cjs --check
          node scripts/build-encounter-examples.cjs --check
          node scripts/build-arena-example.cjs --check
      - name: Run complete source regression suite
        run: node --test tests/*.test.cjs
      - name: Remove transfer and verify final package hashes
        run: |
          git rm -r .part2-transfer
          git add -A
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          manifest = 'docs/SHA256_MANIFEST.json'
          omit = {manifest, '.github/workflows/part2-publish.yml'}
          names = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          files = {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in sorted(names) if name and name not in omit}
          data = {'version': '1.2.0', 'build': 'City Part 2: smart quarters, reserved complexes and bundled assets', 'algorithm': 'SHA-256', 'excluded': [manifest], 'files': files}
          Path(manifest).write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          print('Manifest:', len(files), 'files')
          PY
          node scripts/verify-package.cjs
          git add -A
          git diff --cached --check
      - name: Commit verified source to isolated feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Complete smart city planning, safe landmark compounds and city asset library"
          git push origin HEAD:feature/city-part2-smart-complexes
